<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Repository Index</title>
  <style>
    :root {
      --bg: #f8fafc;
      --panel: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --link: #2563eb;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    .wrap {
      max-width: 900px;
      margin: 48px auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
      padding: 32px 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
    }

    .subtitle {
      color: var(--muted);
      margin-bottom: 20px;
    }

    ul {
      padding-left: 20px;
      margin: 0;
    }

    li {
      margin: 10px 0;
      list-style: disc;
    }

    a {
      color: var(--link);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>仓库文件索引</h1>
    <div class="subtitle">Repository: <strong>xinzi1229/home</strong></div>

    <ul>
      <li><a href="https://github.com/xinzi1229/home/blob/main/index.html">index.html</a></li>
      <li><a href="https://github.com/xinzi1229/home/blob/main/Tihu.html">Tihu.html</a></li>
      <li><a href="https://github.com/xinzi1229/home/blob/main/README.md">README.md</a></li>
      <li><a href="https://github.com/xinzi1229/home/blob/main/.github/workflows/jekyll-gh-pages.yml">.github/workflows/jekyll-gh-pages.yml</a></li>
    </ul>
  </div>
</body>
</html>
